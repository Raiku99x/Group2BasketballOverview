<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anatomy of a Basketball Court</title>
<style>
:root{--bg:#050a14;--fg:#eef4ff;--mut:#9db3d6;--acc:#ffb020;--card:rgba(8,16,32,.72);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Inter",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:5;transition:height 1s cubic-bezier(.6,0,.2,1)}
.bar.t{top:0}.bar.b{bottom:0}.bar{display:none}
.brand{position:fixed;z-index:7;top:calc(env(safe-area-inset-top,0px) + 18px);left:22px;z-index:6;font-weight:700;letter-spacing:.18em;font-size:20px;text-transform:uppercase;color:var(--mut)}
.brand b{color:var(--acc)}
.card{position:fixed;left:0;top:0;bottom:0;width:37%;min-width:380px;z-index:6;background:linear-gradient(90deg,rgba(5,10,20,.92) 0%,rgba(5,10,20,.8) 65%,rgba(5,10,20,0) 100%);padding:90px 64px 40px 40px;pointer-events:none;display:flex;flex-direction:column;justify-content:center;transition:opacity .5s,transform .5s}
.card.out{opacity:0;transform:translateY(14px)}
.num{font-size:21px;letter-spacing:.2em;color:var(--acc);font-weight:700}
h1{margin:8px 0 12px;font-size:clamp(38px,3.5vw,64px);line-height:1.1;font-weight:800}
p{margin:0 0 14px;color:#cfdcf5;line-height:1.5;font-size:clamp(23px,2.1vw,38px)}
.tip{margin:0 0 18px;padding:12px 16px;border-left:3px solid var(--acc);background:rgba(255,176,32,.1);font-size:clamp(15px,1.2vw,21px);line-height:1.45;color:#ffe3b0;border-radius:0 10px 10px 0}.tip b{display:block;font-size:.7em;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 15px;border-radius:99px;background:rgba(255,176,32,.14);border:1px solid rgba(255,176,32,.4);font-size:18px;color:#ffd58a}
.nav{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:6;display:flex;gap:10px;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid rgba(255,255,255,.2);background:var(--card);color:var(--fg);padding:14px 26px;font-size:19px;border-radius:12px;backdrop-filter:blur(10px);font-weight:600}
button.p{background:var(--acc);color:#1a1000;border-color:var(--acc)}button:hover{filter:brightness(1.15)}
.dots{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:12px}
.dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.28);cursor:pointer;transition:.3s;border:0;padding:0}
.dot.on{background:var(--acc);transform:scale(1.5);box-shadow:0 0 12px var(--acc)}
@media(max-width:640px){.nav{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 12px)}.dots{display:none}h1{font-size:38px}p{font-size:23px}.chip{font-size:15px}button{font-size:16px;padding:12px 18px}.card{padding:20px 18px 70px;top:auto;width:100%;min-width:0;height:44%;background:linear-gradient(0deg,rgba(5,10,20,.94) 60%,rgba(5,10,20,0))}}
.tip{display:none!important}@media(max-width:640px){.brand{font-size:14px;letter-spacing:.12em;max-width:60%}}.brand{z-index:50!important;pointer-events:none}</style></head><body>
<canvas id="c"></canvas>
<div class="bar t"></div><div class="bar b"></div>

<div class="brand">Anatomy of a Basketball Court</div>
<div class="card" id="card"><div class="num" id="num"></div><h1 id="ti"></h1><p id="tx"></p><div class="chips" id="ch"></div></div>
<div class="nav"><button id="pv">← Back</button><button class="p" id="nx">Next →</button></div>
<div class="dots" id="dots"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,cv=document.getElementById('c');
const R=new T.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,matchMedia('(pointer:coarse)').matches?1.5:2));
const S=new T.Scene();S.background=new T.Color(0x050a14);S.fog=new T.Fog(0x050a14,40,95);
const cam=new T.PerspectiveCamera(45,1,.1,200);
S.add(new T.HemisphereLight(0xbcd4ff,0x101830,.45));
const dl=new T.DirectionalLight(0xffffff,.4);dl.position.set(-8,25,10);S.add(dl);
var AF=1;function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);if(w<=640){const fh=h*.56;cam.aspect=w/fh;cam.setViewOffset(w,fh,0,0,w,h)}else{const fw=w*.83;cam.aspect=fw/h;cam.setViewOffset(fw,h,-(w-fw),0,w,h)}AF=Math.max(1,Math.pow(1.7/cam.aspect,.7));cam.fov=Math.min(80,(cam.userData.bf||45)*AF);cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();

// floor
const flat=(w,d,c,y,o)=>{const m=new T.Mesh(new T.PlaneGeometry(w,d),new T.MeshStandardMaterial({color:c,roughness:.55,transparent:o!==undefined,opacity:o??1}));m.rotation.x=-Math.PI/2;m.position.y=y;S.add(m);return m};
flat(200,200,0x070d1a,-.05);flat(33,20,0x4a96e0,-.01);flat(28,15,0x2f80e0,0);
const key=[];
// line helpers (x,z on floor)
const Y=.02;
function strip(pts,w,mat,closed){const v=[],ix=[],n=pts.length;
 for(let i=0;i<n;i++){const a=pts[closed?(i-1+n)%n:Math.max(i-1,0)],b=pts[closed?(i+1)%n:Math.min(i+1,n-1)];
  let tx=b[0]-a[0],tz=b[1]-a[1];const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
  v.push(pts[i][0]-tz*w/2,Y,pts[i][1]+tx*w/2,pts[i][0]+tz*w/2,Y,pts[i][1]-tx*w/2)}
 const m=closed?n:n-1;for(let i=0;i<m;i++){const a=i*2,b=((i+1)%n)*2;ix.push(a,a+1,b,a+1,b+1,b)}
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(v,3));g.setIndex(ix);
 const me=new T.Mesh(g,mat);me.material.side=T.DoubleSide;S.add(me);return me}
const seg=(a,b,w,m)=>{const dx=b[0]-a[0],dz=b[1]-a[1],l=Math.hypot(dx,dz),e=w/2/l;return strip([[a[0]-dx*e,a[1]-dz*e],[b[0]+dx*e,b[1]+dz*e]],w,m)};
const arc=(cx,cz,r,a0,a1,n=64)=>{const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([cx+r*Math.cos(a),cz+r*Math.sin(a)])}return p};
const mk=()=>new T.MeshBasicMaterial({color:0xffffff});
const M={bound:mk(),center:mk(),key:mk(),ft:mk(),three:mk(),rim:new T.MeshStandardMaterial({color:0xff6a1a,roughness:.4}),ra:mk()};
const W=.1,PI=Math.PI;
// boundary + halfway line
[[[-14,-7.5],[14,-7.5]],[[14,-7.5],[14,7.5]],[[14,7.5],[-14,7.5]],[[-14,7.5],[-14,-7.5]]].forEach(s=>seg(s[0],s[1],W,M.bound));
seg([0,-7.5],[0,7.5],W,M.center);
strip(arc(0,0,1.8,0,2*PI,72).slice(0,-1),W,M.center,true);
// paint fills
const fills=[];
[-1,1].forEach(s=>{
 const cx=s*14,rx=s*1.575*-1+ -0; // placeholder
 const hx=s*(14-1.575)*1;const rimX=s*(14-1.575);
 const px=s*(14-2.9);
 const f=new T.Mesh(new T.PlaneGeometry(5.8,4.9),new T.MeshBasicMaterial({color:0xffb020,transparent:true,opacity:0}));f.rotation.x=-PI/2;f.position.set(px,.012,0);S.add(f);fills.push(f);
 // key
 const bx=s*14,fx=s*(14-5.8);
 seg([bx,-2.45],[fx,-2.45],W,M.key);seg([bx,2.45],[fx,2.45],W,M.key);seg([fx,-2.45],[fx,2.45],W,M.key);
 // free throw circle
 const a0=s>0?PI/2:-PI/2;
 strip(arc(fx,0,1.8,a0,a0+PI),W,M.ft);
 for(let k=0;k<6;k++){const b0=a0+PI+k*PI/6+.05,b1=b0+PI/12-.02;strip(arc(fx,0,1.8,b0,b1,6),W,M.ft)}
 // three point
 const R3=6.75,th=Math.asin(6.6/R3),xs=Math.sqrt(R3*R3-6.6*6.6);
 const ang=s>0?[PI-th,PI+th]:[-th,th];
 strip(arc(rimX,0,R3,ang[0],ang[1],90),W,M.three);
 [-6.6,6.6].forEach(z=>seg([bx,z],[rimX+(-s)*xs,z],W,M.three));
 // restricted
 strip(arc(rimX,0,1.25,s>0?PI/2:-PI/2,(s>0?PI/2:-PI/2)+PI,32),W,M.ra);
 seg([bx-s*0,-1.25],[rimX,-1.25],W,M.ra);seg([bx,1.25],[rimX,1.25],W,M.ra);
 // hoop assembly
 const g=new T.Group();
 const bm=new T.Mesh(new T.BoxGeometry(.05,1.05,1.8),new T.MeshStandardMaterial({color:0xcfe6ff,transparent:true,opacity:.35,roughness:.1}));
 const be=new T.LineSegments(new T.EdgesGeometry(bm.geometry),M.bEdge||(M.bEdge=new T.LineBasicMaterial({color:0xffffff})));
 const bxp=s*(14-1.2);bm.position.set(bxp,3.425,0);be.position.copy(bm.position);g.add(bm,be);
 const sq=new T.Mesh(new T.BoxGeometry(.06,.45,.59),new T.MeshBasicMaterial({color:0xffffff,wireframe:true}));sq.position.set(bxp-s*.02,3.3,0);g.add(sq);
 const rim=new T.Mesh(new T.TorusGeometry(.225,.014,8,32),M.rim);rim.rotation.x=PI/2;rim.position.set(rimX,3.05,0);g.add(rim);
 const net=new T.Mesh(new T.CylinderGeometry(.225,.13,.42,16,3,true),new T.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.7}));net.position.set(rimX,2.84,0);g.add(net);
 const pole=new T.Mesh(new T.BoxGeometry(.2,3.6,.2),new T.MeshStandardMaterial({color:0x222b3d}));pole.position.set(s*14.9,1.8,0);g.add(pole);
 const arm=new T.Mesh(new T.BoxGeometry(2.1,.14,.14),new T.MeshStandardMaterial({color:0x222b3d}));arm.position.set(s*13.9,3.5,0);g.add(arm);
 S.add(g);
});
const mats=o=>Object.values(o);
// tour
const P=[
 {t:'The Full Court',x:'A basketball court is 28 m long and 15 m wide, with a basket at each end. Each team attacks one basket and defends the other.',b:'Know which basket you are attacking before the game starts.',c:['28 m long','15 m wide','2 baskets'],m:[],p:[0,23,25],g:[0,0,0],f:45},
 {t:'Boundary Lines',x:'The boundary lines mark the playing area. If the ball or a player touches the line or the floor outside it, the ball is out of bounds and the other team gets possession.',b:'Watch your feet near the edge: stepping on the line counts as out.',c:['Sidelines: long sides','Baselines: short ends','Out of bounds'],m:[M.bound],p:[-25,12,15],g:[-9,0,0],f:42},
 {t:'Halfway Line & Center Circle',x:'The halfway line splits the court into two halves. The center circle is where the game starts with a jump ball.',b:'Once your team crosses the halfway line with the ball, you cannot pass it back over the line.',c:['Halfway line','Center circle','Jump ball'],m:[M.center],p:[0,7.5,7.5],g:[0,0,0],f:40},
 {t:'The Key (The Paint)',x:'The key, or paint, is the marked box under each basket. An attacker cannot stay inside it for more than three seconds.',b:'Keep moving in and out of the paint instead of waiting there for the ball.',c:['Rectangle under the basket','Three-second rule','Rebounding area'],m:[M.key],fill:1,p:[-4,9,10],g:[-11,0,0],f:42},
 {t:'Free Throw Line & Circle',x:'The free throw line is where a fouled player takes an unguarded shot. Each successful free throw is worth one point.',b:'Practice free throws early. They are the easiest points in the game.',c:['Unguarded shot','1 point each','Awarded after a foul'],m:[M.ft],p:[-3.5,4.6,5.2],g:[-8.4,0,0],f:44},
 {t:'The Three-Point Line',x:'The three-point arc surrounds the basket. A shot made from behind it scores three points, and from inside it scores two.',b:'Keep both feet fully behind the line, or the shot only counts for two.',c:['Behind the line: 3 points','Inside the line: 2 points','Greater distance'],m:[M.three],p:[-1,17,15],g:[-10,0,0],f:46},
 {t:'Backboard, Rim & Net',x:'The basket has a rim, a net, and a backboard. The rim is 3.05 m above the floor, and the ball must pass down through it to score.',b:'When shooting from an angle, aim for the small square on the backboard.',c:['Rim height: 3.05 m','Ball passes through','Backboard'],m:[M.rim,M.bEdge],p:[-8.5,4.2,4.5],g:[-12.7,3,0],f:45}
];
const up=new T.Vector3(0,1,0);
const V=a=>new T.Vector3(...a);
let cur=0,busy=false,tr=null,hl=[];
cam.position.set(0,45,45);const look=new T.Vector3(0,0,0);let tgtNow=look.clone();
const card=document.getElementById('card'),dots=document.getElementById('dots');
P.forEach((_,i)=>{const d=document.createElement('button');d.className='dot';d.onclick=()=>go(i);dots.appendChild(d)});
function fillText(i){const p=P[i];num.textContent=String(i+1).padStart(2,'0')+' / '+String(P.length).padStart(2,'0');ti.textContent=p.t;tx.textContent=p.x;ch.innerHTML=p.c.map(c=>'<span class="chip">'+c+'</span>').join('');
 [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i))}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function go(i,first){if(busy||i<0||i>=P.length)return;busy=true;const p=P[i];
 document.body.classList.add('cine');fillText(i);
 hl=p.m;fills.forEach(f=>f.userData.on=!!p.fill);
 const dur=first?3200:2800;
 tr={t0:performance.now(),dur,fp:cam.position.clone(),ft:tgtNow.clone(),tp:V(p.p),tt:V(p.g),ff:cam.userData.bf||45,tf:p.f,sw:false,i};
 cur=i}
function frame(now){requestAnimationFrame(frame);
 const t=now/1000;
 // highlight pulse
 const pulse=.5+.5*Math.sin(t*4);
 for(const k in M){const m=M[k];if(!m.color)continue;const on=hl.includes(m);
  const base=k==='rim'?new T.Color(0xff6a1a):new T.Color(0xffffff);
  const tgt=on?new T.Color(0xffb020).lerp(new T.Color(0xfff2c0),pulse):base;m.color.lerp(tgt,.12)}
 if(M.bEdge){const on=hl.includes(M.bEdge);M.bEdge.color.lerp(on?new T.Color(0xffb020):new T.Color(0xffffff),.12)}
 fills.forEach(f=>{const o=f.userData.on?.28+.12*pulse:0;f.material.opacity+=(o-f.material.opacity)*.1});
 if(tr){let e=Math.min((now-tr.t0)/tr.dur,1),k=ease(e);
  const p=tr.fp.clone().lerp(tr.tp,k);p.y+=Math.sin(Math.PI*k)*Math.max(5,tr.fp.distanceTo(tr.tp)*.35);
  cam.position.copy(p);tgtNow.lerpVectors(tr.ft,tr.tt,k);cam.userData.bf=tr.ff+(tr.tf-tr.ff)*k;cam.fov=Math.min(80,cam.userData.bf*AF);
  if(!tr.sw&&e>.45){tr.sw=true}
  cam.updateProjectionMatrix();cam.lookAt(tgtNow);
  if(e>=1){tr.base=tr.tp.clone();const d=tr;tr=null;busy=false;card.classList.remove('out');document.body.classList.remove('cine');rest=d}
 }else if(typeof rest!=='undefined'){const o=rest.tp;
  cam.position.set(o.x+Math.sin(t*.35)*.9,o.y+Math.sin(t*.5)*.25,o.z+Math.cos(t*.35)*.5);cam.lookAt(tgtNow)}
 R.render(S,cam)}
let rest;
requestAnimationFrame(frame);
document.getElementById('nx').onclick=()=>go(cur+1>=P.length?0:cur+1);
document.getElementById('pv').onclick=()=>go(cur-1<0?P.length-1:cur-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e===' ')nx.click();if(e.key==='ArrowLeft')pv.click()});
go(0,true);
</script><script>(function(){function P(m){parent.postMessage({bb:m},'*')}
function dots(){return [].slice.call(document.querySelectorAll('#dots .dot'))}
function idx(){return dots().findIndex(function(x){return x.classList.contains('on')})}
var aN=false,aP=false,last=-1;
document.addEventListener('click',function(e){var t=e.target;if(!t.closest)return;
var a=t.closest('a.go');if(a){e.preventDefault();e.stopPropagation();P('next');return}
var n=dots().length;if(!n)return;var i=idx();
if(t.closest('#nx')){aN=(i===n-1);aP=false}
else if(t.closest('#pv')){aP=(i===0);aN=false}
else if(t.closest('.dot')){aN=false;aP=false}},true);
function watch(){var d=document.getElementById('dots');if(!d||!d.children.length){setTimeout(watch,200);return}
last=idx();
new MutationObserver(function(){var n=dots().length,i=idx();if(i<0)return;
if(aN&&last===n-1&&i===0){aN=false;last=i;P('next');return}
if(aP&&last===0&&i===n-1){aP=false;last=i;P('prev');return}
if(i!==last){aN=false;aP=false}
last=i}).observe(d,{subtree:true,attributes:true,attributeFilter:['class']})}
watch();
var st=document.createElement('style');st.textContent='.tag{display:none!important}';document.head.appendChild(st);
window.addEventListener('load',function(){try{window.focus()}catch(x){}})})();</script></body></html>
