});

// ---- ball
const HX=-(14-1.575),PER=3.6,BASE=1.829;
const B={m:'shoot',sx:-9.3,sz:0};

ball.add(new T.Mesh(new T.SphereGeometry(.12,24,16),new T.MeshStandardMaterial({color:0xd2691e,roughness:.6})));

let DT0=0;const BEAT=.75,BR=.12;
const COMBO=[['R','R',.4,.38,.4,.38],['R','R',.4,.38,.4,.38],['R','L',.4,.38,-.4,.38],['L','L',-.4,.38,-.4,.38],['L','L',-.4,.38,-.4,.38],['L','R',-.4,.38,.15,-.38],['R','R',.15,-.38,.42,.34],['R','R',.42,.34,.42,.34]];

function shootPose(o,s){const D=o.bd,k=o.H/1.9,B=shotB(s),dip=B*k;
 if(!(D.pel&&D.s1&&D.s2&&D.nk&&D.legL.every(Boolean)&&D.legR.every(Boolean)))return;
