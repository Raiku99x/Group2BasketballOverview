<style>

flat(200,200,0x070d1a,-.05);flat(33,20,0x4a96e0,-.01);flat(28,15,0x2f80e0,0);

[-1,1].forEach(s=>{

 {const RN=7.24,thn=Math.asin(6.6/RN);strip(arc(rimX,0,RN,...(s>0?[PI-thn,PI+thn]:[-thn,thn]),90),W*1.15,M.nba)}

 const bm=new T.Mesh(new T.BoxGeometry(.05,1.05,1.8),new T.MeshStandardMaterial({color:0xcfe6ff,transparent:true,opacity:.35,roughness:.1}));

});

// ---- helpers copied from the Positions page (IK arms/legs, shot form, dribble combo)
let DT0=0;const BEAT=.75,BR=.12;
const COMBO=[['R','R',.4,.38,.4,.38],['R','R',.4,.38,.4,.38],['R','L',.4,.38,-.4,.38],['L','L',-.4,.38,-.4,.38],['L','L',-.4,.38,-.4,.38],['L','R',-.4,.38,.15,-.38],['R','R',.15,-.38,.42,.34],['R','R',.42,.34,.42,.34]];
const vA=new T.Vector3(),vB=new T.Vector3(),vC=new T.Vector3(),YAX=new T.Vector3(0,1,0);
function rotBone(bone,child,want,pivot){const cur=child.clone().sub(pivot).normalize(),w=want.clone().sub(pivot).normalize();const q=new T.Quaternion().setFromUnitVectors(cur,w);const wq=bone.getWorldQuaternion(new T.Quaternion()),pq=bone.parent.getWorldQuaternion(new T.Quaternion());bone.quaternion.copy(pq.invert().multiply(q.multiply(wq)));bone.updateMatrixWorld(true)}

 const l1=A.distanceTo(B),l2=B.distanceTo(C),dir=T3.clone().sub(A);let d=dir.length();dir.normalize();d=Math.min(Math.max(d,Math.abs(l1-l2)+.02),(l1+l2)*.995);

const sm=(a,b,x)=>{x=Math.min(Math.max((x-a)/(b-a),0),1);return x*x*(3-2*x)},REL=1.32,FLT=1.1;
