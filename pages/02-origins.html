<style>
:root{--bg:#050a14;--fg:#eef4ff;--mut:#9db3d6;--acc:#ffb020;--card:rgba(8,16,32,.72);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Inter",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.up{margin:0 0 16px;padding:10px 14px;border:1px dashed rgba(255,176,32,.6);border-radius:10px;font-size:clamp(14px,1.05vw,18px);line-height:1.4;color:#ffd58a}.up b{letter-spacing:.14em;font-size:.75em;text-transform:uppercase;color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 15px;border-radius:99px;background:rgba(255,176,32,.14);border:1px solid rgba(255,176,32,.4);font-size:18px;color:#ffd58a}
.nav{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:6;display:flex;gap:10px;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid rgba(255,255,255,.2);background:var(--card);color:var(--fg);padding:14px 26px;font-size:19px;border-radius:12px;backdrop-filter:blur(10px);font-weight:600}
button.p{background:var(--acc);color:#1a1000;border-color:var(--acc)}button:hover{filter:brightness(1.15)}
.dots{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:12px}
.dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.28);cursor:pointer;transition:.3s;border:0;padding:0;backdrop-filter:none}
.dot.on{background:var(--acc);transform:scale(1.5);box-shadow:0 0 12px var(--acc)}
@media(max-width:640px){.nav{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 12px);flex-wrap:wrap;justify-content:flex-end;max-width:80%}.dots{display:none}h1{font-size:38px}p{font-size:23px}.chip{font-size:15px}button{font-size:15px;padding:10px 14px}.card{padding:20px 18px 70px;top:auto;width:100%;min-width:0;height:48%;background:linear-gradient(0deg,rgba(5,10,20,.94) 60%,rgba(5,10,20,0))}}
.up,#ub{display:none!important}.tip{display:none!important}@media(max-width:640px){.brand{font-size:14px;letter-spacing:.12em;max-width:60%}}.brand{z-index:50!important;pointer-events:none}</style></head><body>

<script>
const T=THREE,cv=document.getElementById('c'),PI=Math.PI;
const R=new T.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,matchMedia('(pointer:coarse)').matches?1.5:2));
const S=new T.Scene();S.background=new T.Color(0x050a14);S.fog=new T.Fog(0x050a14,30,80);
const cam=new T.PerspectiveCamera(45,1,.1,200);
S.add(new T.HemisphereLight(0xbcd4ff,0x101830,.8));
const dl=new T.DirectionalLight(0xffffff,.7);dl.position.set(-8,25,14);S.add(dl);
const pl=new T.PointLight(0xffd9a0,.9,40);pl.position.set(0,6,6);S.add(pl);
var AF=1;function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);if(w<=640){const fh=h*.56;cam.aspect=w/fh;cam.setViewOffset(w,fh,0,0,w,h)}else{const fw=w*.83;cam.aspect=fw/h;cam.setViewOffset(fw,h,-(w-fw),0,w,h)}AF=Math.max(1,Math.pow(1.7/cam.aspect,.7));cam.fov=Math.min(80,(cam.userData.bf||45)*AF);cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();

const SP=30, std=(c,r)=>new T.MeshStandardMaterial({color:c,roughness:r??.6});
const box=(w,h,d,m,x,y,z,g)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);(g||S).add(o);return o};
const cyl=(rt,rb,h,m,x,y,z,g,seg)=>{const o=new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg||24),m);o.position.set(x,y,z);(g||S).add(o);return o};
// floor
{const f=new T.Mesh(new T.PlaneGeometry(400,200),new T.MeshStandardMaterial({color:0x070d1a,roughness:.9}));f.rotation.x=-PI/2;f.position.y=-.05;S.add(f)}
for(let i=0;i<5;i++){const X=i*SP;
 const d=new T.Mesh(new T.CircleGeometry(7,64),new T.MeshStandardMaterial({color:0x2f80e0,roughness:.55}));d.rotation.x=-PI/2;d.position.set(X,0,1);S.add(d);
 const r=new T.Mesh(new T.RingGeometry(6.8,6.95,64),new T.MeshBasicMaterial({color:0xffffff,side:T.DoubleSide}));r.rotation.x=-PI/2;r.position.set(X,.01,1);S.add(r)}

// glowing frames + upload screens
const G=[0,1,2,3,4].map(()=>new T.MeshBasicMaterial({color:0x4a6fa5}));
const screens=[[],[],[],[],[]];
function placeholder(label,tint){const c=document.createElement('canvas');c.width=640;c.height=480;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,640,480);g.addColorStop(0,tint||'#0d1a33');g.addColorStop(1,'#16294d');x.fillStyle=g;x.fillRect(0,0,640,480);
 x.setLineDash([14,10]);x.strokeStyle='#ffb020';x.lineWidth=4;x.strokeRect(28,28,584,424);x.setLineDash([]);
 x.fillStyle='#ffb020';x.font='bold 120px sans-serif';x.textAlign='center';x.fillText('+',320,230);
 x.fillStyle='#eef4ff';x.font='bold 34px sans-serif';x.fillText('YOUR PHOTO / VIDEO HERE',320,300);
 x.fillStyle='#9db3d6';x.font='26px sans-serif';x.fillText(label,320,350);
 return new T.CanvasTexture(c)}
function screen(i,w,h,pos,rotY,label,tint){
 const g=new T.Group();g.position.set(...pos);g.rotation.y=rotY||0;S.add(g);
 box(w+.25,h+.25,.12,G[i],0,0,-.04,g);
 box(w,h,.01,new T.MeshBasicMaterial({color:0x000000}),0,0,.03,g);
 const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:placeholder(label,tint)}));m.position.z=.04;g.add(m);
 const sc={mesh:m,w,h,has:false};screens[i].push(sc);return g}
const anim=[];

// 1 — retro TV
{const X=0,wood=std(0x6b4423,.7),g=new T.Group();S.add(g);
 box(5.4,3.8,2.6,wood,X,2.3,-1.4);
 box(1.3,3.0,.1,std(0x2a1a0c),X+2.0,2.3,-.08);
 [2.9,2.1].forEach(y=>cyl(.25,.25,.2,std(0xcfa35a,.3),X+2.0,y,.05,null).rotation.x=PI/2);
 for(let k=0;k<4;k++)box(1.1,.05,.05,std(0x120a04),X+2.0,1.5-k*.2,-.04);
 [[-2.2,-.2],[2.2,-.2],[-2.2,-2.4],[2.2,-2.4]].forEach(p=>cyl(.18,.1,.4,std(0x222222),X+p[0],.2,p[1]));
 [-1,1].forEach(s=>{const a=cyl(.03,.03,2.4,std(0xcccccc,.3),X+s*.9,5.3,-1.4);a.rotation.z=-s*.5});
 screen(0,3.6,2.7,[X-.7,2.4,.02],0,'Dr. James Naismith / first game','#2a1a0c')}

// 2 — peach basket on the wall
{const X=SP;
 box(12,6.5,.4,std(0x1b2740),X,3.25,-1.2);
 for(let k=-5;k<=5;k++)box(.04,6.5,.02,std(0x25355a),X+k,3.25,-.98);
 screen(1,3.6,2.7,[X-.4,3.7,-.98],0,'Original peach-basket setup','#2b1d10');
 const g=new T.Group();S.add(g);
 const bm=new T.MeshStandardMaterial({color:0xf0a868,roughness:.8,side:T.DoubleSide});
 cyl(.6,.45,.75,bm,X+2.8,2.65,-.2,g).material=bm;
 const wf=new T.Mesh(new T.CylinderGeometry(.61,.46,.75,16,3,true),new T.MeshBasicMaterial({color:0x8a4b14,wireframe:true}));wf.position.set(X+2.8,2.65,-.2);g.add(wf);
 const rim=new T.Mesh(new T.TorusGeometry(.6,.04,8,32),std(0xb86a22,.4));rim.rotation.x=PI/2;rim.position.set(X+2.8,3.03,-.2);g.add(rim);
 const ball=new T.Mesh(new T.SphereGeometry(.34,20,16),std(0xd2691e,.6));ball.position.set(X+2.8,3.0,-.2);g.add(ball);
 box(1.4,.14,.8,std(0x6b4423),X+2.8,3.0,-.7,g);
 anim.push(t=>{ball.position.y=3.12+Math.sin(t*2)*.08})}

// 3 — rules scroll
{const X=2*SP,g=new T.Group();g.position.set(X,2.7,0);S.add(g);
 const wd=std(0x8a5a2b,.5),gold=std(0xd4a017,.3);
 [2.45,-2.45].forEach(y=>{const r=cyl(.24,.24,3.9,wd,0,y,0,g);r.rotation.z=PI/2;[-1,1].forEach(s=>{const k=new T.Mesh(new T.SphereGeometry(.2,12,10),gold);k.position.set(s*2,y,0);g.add(k)})});
 const sc=screen(2,3.4,4.3,[0,0,.02],0,'Naismith’s 13 original rules','#3a2a14');S.remove(sc);g.add(sc);
 anim.push(t=>{g.position.y=2.7+Math.sin(t*1.2)*.12;g.rotation.y=Math.sin(t*.6)*.06})}

// 4 — projector + big screen
{const X=3*SP;
 screen(3,7,3.9,[X,2.9,-.2],0,'Early game footage / 1892 team photo','#101c36');
 [-1,1].forEach(s=>box(.15,5.2,.15,std(0x2a3346),X+s*3.8,2.6,-.35));
 const pr=std(0x2a3346,.5);box(1.6,.8,1.2,pr,X,2.9,8);cyl(.18,.18,2.6,pr,X,1.3,8);box(1.4,.1,1.4,pr,X,.05,8);
 const lens=cyl(.3,.3,.3,new T.MeshBasicMaterial({color:0xffb020}),X,2.9,7.3);lens.rotation.x=PI/2;
 const cone=new T.Mesh(new T.ConeGeometry(3.4,7.3,32,1,true),new T.MeshBasicMaterial({color:0xffd58a,transparent:true,opacity:.07,side:T.DoubleSide,depthWrite:false}));
 cone.rotation.x=PI/2;cone.position.set(X,2.9,3.65);S.add(cone);
 anim.push(t=>{cone.material.opacity=.06+.02*Math.sin(t*9)})}

// 5 — globe + 3 screens
{const X=4*SP,g=new T.Group();g.position.set(X,2.4,0);g.scale.setScalar(.8);S.add(g);
 g.add(new T.Mesh(new T.SphereGeometry(1.5,32,24),std(0x0b2a55,.5)));
 g.add(new T.Mesh(new T.SphereGeometry(1.53,18,14),new T.MeshBasicMaterial({color:0x4a96e0,wireframe:true,transparent:true,opacity:.6})));
 cyl(.15,.15,1.6,std(0x2a3346),X,.8,0);cyl(.8,.9,.2,std(0x2a3346),X,.1,0);
 [[-55,'Women’s basketball'],[0,'The NBA today'],[55,'International basketball']].forEach(([a,l])=>{const r=a*PI/180;
  screen(4,3,2.2,[X+5*Math.sin(r),a===0?5.3:2.4,-5*Math.cos(r)],-r,l,'#0d1a33')});
 anim.push(t=>{g.rotation.y=t*.25})}

// tour
const P=[
 {t:'Springfield, 1891',x:'In December 1891, Dr. James Naismith, a PE teacher at the YMCA Training School in Springfield, Massachusetts, invented basketball. He needed an indoor game for students during the long New England winter.',b:'Naismith wanted a game with less roughness than football, one based on skill instead of tackling.',u:'Photo of Dr. James Naismith, or a photo or clip of the first game.',c:['Dr. James Naismith','Springfield, MA','Invented 1891'],p:[-3,3.4,10],g:[0,2.4,0],f:32},
 {t:'The Peach Baskets',x:'The first goals were two peach baskets nailed to the gym balcony rail, 10 feet (3.05 m) above the floor. The baskets still had bottoms, so someone had to climb up and fetch the ball after every score.',b:'The 10 ft rim height from 1891 is still the same on every court today.',u:'Photo of the original peach-basket setup or the Springfield gym.',c:['Peach baskets','10 ft (3.05 m)','Later: open nets'],p:[X1()+.6,3.8,11],g:[SP_(1)+.6,3.1,-.5],f:33},
 {t:'The 13 Original Rules',x:'Naismith wrote 13 rules and posted them on the gym bulletin board. Players could pass the ball but not run with it, and tackling was not allowed. Dribbling was added later.',b:'The original goal: throw the ball into the basket. The rules grew from this list.',u:'Image of the 13 original rules (handwritten or typed page).',c:['13 rules','No running with the ball','No tackling'],p:[2*SP_(1),3,9.5],g:[2*SP_(1),2.7,0],f:32},
 {t:'The First Game',x:'The first game had 18 students, nine on each side. It ended 1–0, with the only basket scored by William R. Chase. Within weeks, the game was drawing crowds.',b:'There were no fixed positions, and nobody was yet called a guard or a forward.',u:'Video or photo of an early game, or the 1892 team photo.',c:['9 players per side','Final score: 1–0','Crowds in weeks'],p:[3*SP_(1)+4,3.6,13],g:[3*SP_(1),2.6,2],f:36},
 {t:'Basketball Goes Global',x:'The game spread through YMCAs and colleges. Senda Berenson adapted it for women at Smith College in 1892. FIBA formed in 1932, and basketball became an Olympic sport at the 1936 Berlin Games.',b:'From two peach baskets to a worldwide sport: it all began with one idea in one gym.',u:'Up to 3 images/videos: women’s basketball, 1936 Olympics, modern game.',c:['Women’s game: 1892','FIBA: 1932','Olympics: 1936'],p:[4*SP_(1),5.2,12],g:[4*SP_(1),3.2,-1.5],f:40}
];
function SP_(n){return SP*n}function X1(){return SP}
const V=a=>new T.Vector3(...a);
let cur=0,busy=false,tr=null,rest;
cam.position.set(0,45,45);let tgtNow=new T.Vector3();
const card=document.getElementById('card'),dots=document.getElementById('dots');
P.forEach((_,i)=>{const d=document.createElement('button');d.className='dot';d.onclick=()=>go(i);dots.appendChild(d)});
function fillText(i){const p=P[i];num.textContent=String(i+1).padStart(2,'0')+' / '+String(P.length).padStart(2,'0');ti.textContent=p.t;tx.textContent=p.x;upn.innerHTML='<b>Upload here</b><br>'+p.u;ch.innerHTML=p.c.map(c=>'<span class="chip">'+c+'</span>').join('');
 [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i))}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function go(i,first){if(busy||i<0||i>=P.length)return;busy=true;const p=P[i];fillText(i);
 tr={t0:performance.now(),dur:first?3200:2800,fp:cam.position.clone(),ft:tgtNow.clone(),tp:V(p.p),tt:V(p.g),ff:cam.userData.bf||45,tf:p.f};cur=i}
function frame(now){requestAnimationFrame(frame);const t=now/1000,pulse=.5+.5*Math.sin(t*4);
 G.forEach((m,i)=>m.color.lerp(i===cur?new T.Color(0xffb020).lerp(new T.Color(0xfff2c0),pulse):new T.Color(0x4a6fa5),.12));
 anim.forEach(f=>f(t));
 if(tr){const e=Math.min((now-tr.t0)/tr.dur,1),k=ease(e);
  const p=tr.fp.clone().lerp(tr.tp,k);p.y+=Math.sin(PI*k)*Math.max(5,tr.fp.distanceTo(tr.tp)*.3);
  cam.position.copy(p);tgtNow.lerpVectors(tr.ft,tr.tt,k);cam.userData.bf=tr.ff+(tr.tf-tr.ff)*k;cam.fov=Math.min(80,cam.userData.bf*AF);
  cam.updateProjectionMatrix();cam.lookAt(tgtNow);pl.position.set(tgtNow.x,6,tgtNow.z+6);
  if(e>=1){rest=tr;tr=null;busy=false}
 }else if(rest){const o=rest.tp;cam.position.set(o.x+Math.sin(t*.35)*.9,o.y+Math.sin(t*.5)*.25,o.z+Math.cos(t*.35)*.5);cam.lookAt(tgtNow)}
 R.render(S,cam)}
requestAnimationFrame(frame);
nx.onclick=()=>go(cur+1>=P.length?0:cur+1);pv.onclick=()=>go(cur-1<0?P.length-1:cur-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')nx.click();if(e.key==='ArrowLeft')pv.click()});

// upload: shows a photo or video on the current slide's 3D screen
ub.onclick=()=>fi.click();
fi.onchange=()=>{const f=fi.files[0];if(!f)return;const list=screens[cur];
 let s=list.find(q=>!q.has);if(!s){s=list[(list.rr=(list.rr||0)+1)%list.length]}
 const url=URL.createObjectURL(f);
 const fit=(w,h)=>{const a=w/h,b=s.w/s.h;s.mesh.scale.set(a>b?1:a/b,a>b?b/a:1,1)};
 const use=tx=>{tx.minFilter=T.LinearFilter;s.mesh.material.map=tx;s.mesh.material.needsUpdate=true;s.has=true};
 if(f.type.startsWith('video')){const v=document.createElement('video');v.src=url;v.loop=true;v.muted=true;v.playsInline=true;
  v.onloadedmetadata=()=>{fit(v.videoWidth,v.videoHeight);use(new T.VideoTexture(v));v.play()}}
